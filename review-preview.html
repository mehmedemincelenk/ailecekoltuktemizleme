<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yorum Taslakları — Yayın Öncesi Kontrol</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="styles.css">
    <style>
      .review-preview-page {
        min-height: 100vh;
        background: var(--cream);
}

      .review-preview-main {
        width: min(calc(100% - 2rem), 60rem);
        margin-inline: auto;
        padding-block: 3rem;
      }

      .review-preview-note {
        max-width: 50rem;
        margin-bottom: 2rem;
        padding: 1rem;
        border: 1px solid var(--warm);
        border-radius: var(--radius-sm);
        background: var(--paper);
        color: var(--ink-muted);
}

      .review-preview-note strong {
        color: var(--ink-deep);
}

      .review-draft-slider {
        display: flex;
        gap: 1rem;
        overflow-x: auto;
        padding: 0.5rem 0.1rem 1.5rem;
        scroll-snap-type: x mandatory;
        scrollbar-width: thin;
}

      .review-draft-card {
        flex: 0 0 min(82%, 21rem);
        min-height: 13rem;
        padding: 1.5rem;
        scroll-snap-align: start;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--paper);
        box-shadow: var(--shadow-sm);
}

      .review-draft-card strong {
        display: inline-block;
        margin-bottom: 2rem;
        color: var(--ink-muted);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
}

      .review-draft-card p {
        color: var(--ink-deep);
        font-size: 1.28rem;
        font-weight: 750;
        line-height: 1.3;
}

      .review-preview-controls {
        display: flex;
        gap: 0.75rem;
}

      .review-preview-controls button {
        min-height: 3rem;
        padding-inline: 1.25rem;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--paper);
        color: var(--ink-deep);
        font: inherit;
        font-weight: 750;
        cursor: pointer;
}

      @media (min-width: 48rem) {
        .review-preview-main {
          padding-block: 5rem;
        }

        .review-draft-card {
          flex-basis: min(45%, 25rem);
}
}
    </style>
    <script src="data/review-drafts.js" defer></script>
    <script src="review-preview.js" defer></script>
  </head>
  <body class="review-preview-page">
    <main class="review-preview-main">
      <p class="section-kicker">Yayın öncesi kontrol</p>
      <h1>Yorum taslakları</h1>
      <p class="review-preview-note">
        <strong>Bu mesajlar gerçek müşteri yorumu değildir.</strong>
        Gerçek müşteri mesajıyla eşleştirilmeden ana siteye alınmazlar.
      </p>

      <section aria-labelledby="taslak-baslik">
        <h2 id="taslak-baslik">Gerçek yorumlarla karşılaştırılacak kısa metinler</h2>
        <div class="review-draft-slider" data-review-draft-slider></div>
        <div class="review-preview-controls">
          <button type="button" data-review-prev aria-label="Önceki yorum taslağı">← Önceki</button>
          <button type="button" data-review-next aria-label="Sonraki yorum taslağı">Sonraki →</button>
        </div>
      </section>
    </main>
  </body>
</html>
